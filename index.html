
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Manager</h1>

        <h2 id="clock"></h2>

        <form id="studentForm">
            <input type="text" id="name" placeholder="Имя студента">
            <input type="number" id="score" placeholder="Баллы">
            <button type="submit">Добавить</button>
        </form>

        <input type="text" id="search" placeholder="Поиск студента">

        <div>
            <button id="sort">Сортировать по баллам</button>
        </div>

        <h3 id="average">Средний балл: 70</h3>
        <p id="message"></p>

        <div id="studentList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
